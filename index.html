<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>微微的冰蓝色小屋 · 第二版</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eaf3fb;color:#344e6b;font-family:system-ui,-apple-system,"Noto Sans SC",sans-serif}header{padding:13px 16px;background:#fbfdff;border-bottom:1px solid #d6e4f1}header strong{font-size:17px}header p{font-size:12px;color:#71869c;margin:4px 0 0}main{max-width:1100px;margin:auto;padding:12px}.toolbar,.furnbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:9px}button{border:1px solid #c4d8eb;background:#fff;color:#385574;border-radius:10px;padding:9px 11px;font-size:13px;cursor:pointer}button.active{background:#dcecff;border-color:#91b7df}#wrap{border:1px solid #c6d9eb;border-radius:14px;overflow:hidden;box-shadow:0 6px 24px #8aa6c522;background:white}#stage{position:relative;width:100%;aspect-ratio:1312/1199;overflow:hidden;background:#dceaf7;touch-action:none}#room{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.sprite{position:absolute;height:auto;max-width:none;user-select:none;-webkit-user-drag:none;touch-action:none;cursor:grab;filter:drop-shadow(0 1px 1px #425d7a16)}.sprite:active{cursor:grabbing}.sprite.selected{outline:1px dashed #79a7d6;outline-offset:2px}.hint{font-size:12px;line-height:1.65;color:#637b94;padding:10px 2px}.controlrow{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.controlrow button{min-width:48px}.furnbar button{padding:7px 10px}.tag{font-size:11px;color:#71869c;margin:0 0 7px}@media(min-width:760px){main{padding:18px}}
</style></head><body><header><strong>微微的冰蓝色小屋</strong><p>第二版 · 多件家具 · 触屏拖动 · 自动保存摆放位置</p></header><main>
<div class="toolbar"><button id="selectGirl" class="active">移动小女孩</button><button id="saveBtn">保存摆放</button><button id="resetBtn">恢复初始布局</button></div>
<p class="tag">选择要摆放的家具，再在房间里拖动它。手机上也可以直接用手指拖。</p>
<div class="furnbar" id="furnbar"></div><div id="wrap"><div id="stage"><img id="room" src="room.png" alt="冰蓝色法式卧室背景"></div></div>
<div class="controlrow"><button data-move="up">↑ 上</button><button data-move="left">← 左</button><button data-move="down">↓ 下</button><button data-move="right">右 →</button></div>
<div class="hint" id="status">小屋已打开。拖动家具来布置；摆放位置会保存在当前浏览器中。此版本是可操作原型，尚未加入行走动画或坐下、睡觉等动作。</div>
</main><script>
const defs=[
{id:'girl',name:'小女孩',src:'assets/girl.png',w:8.2,x:48,y:43,z:20},
{id:'bed',name:'床',src:'assets/bed.png',w:35,x:48,y:48,z:7},
{id:'wardrobe',name:'衣柜',src:'assets/wardrobe.png',w:21,x:72,y:15,z:4},
{id:'sofa',name:'沙发',src:'assets/sofa.png',w:29,x:8,y:53,z:8},
{id:'sideboard',name:'矮柜',src:'assets/sideboard.png',w:27,x:12,y:30,z:5},
{id:'books',name:'书本',src:'assets/two_books.png',w:13,x:28,y:37,z:12},
{id:'vase',name:'花瓶',src:'assets/flower_vase.png',w:13,x:78,y:43,z:13},
{id:'plant',name:'绿植',src:'assets/potted_plant.png',w:8,x:84,y:62,z:10},
{id:'bedside',name:'床头柜',src:'assets/bedside_table_lamp_flowers.png',w:14,x:72,y:56,z:14}
];
const stage=document.getElementById('stage'), bar=document.getElementById('furnbar'), els={}, buttons={};let selected='girl',drag=null;
let saved={};try{saved=JSON.parse(localStorage.getItem('blueHomeLayout')||'{}')}catch(e){}
defs.forEach(d=>{let im=document.createElement('img');im.id=d.id;im.className='sprite';im.src=d.src;im.alt=d.name;im.draggable=false;im.style.width=d.w+'%';im.style.left=(saved[d.id]?.x??d.x)+'%';im.style.top=(saved[d.id]?.y??d.y)+'%';im.style.zIndex=d.z;stage.appendChild(im);els[d.id]=im;im.addEventListener('pointerdown',e=>startDrag(d.id,e));let b=document.createElement('button');b.textContent=d.name;b.onclick=()=>choose(d.id);bar.appendChild(b);buttons[d.id]=b;});
function choose(id){selected=id;Object.entries(buttons).forEach(([k,b])=>b.classList.toggle('active',k===id));Object.entries(els).forEach(([k,e])=>e.classList.toggle('selected',k===id));document.getElementById('selectGirl').classList.toggle('active',id==='girl');document.getElementById('status').textContent='当前选中：'+defs.find(d=>d.id===id).name+'。在房间里拖动即可调整位置。'}
document.getElementById('selectGirl').onclick=()=>choose('girl');
function startDrag(id,e){if(id!==selected)choose(id);e.preventDefault();const el=els[id],r=el.getBoundingClientRect(),sr=stage.getBoundingClientRect();drag={id,dx:e.clientX-r.left,dy:e.clientY-r.top,sr};try{el.setPointerCapture(e.pointerId)}catch(err){}}
stage.addEventListener('pointermove',e=>{if(!drag)return;let el=els[drag.id],sr=stage.getBoundingClientRect();let x=(e.clientX-sr.left-drag.dx)/sr.width*100,y=(e.clientY-sr.top-drag.dy)/sr.height*100;el.style.left=Math.max(0,Math.min(100-el.offsetWidth/sr.width*100,x))+'%';el.style.top=Math.max(0,Math.min(100-el.offsetHeight/sr.height*100,y))+'%'});stage.addEventListener('pointerup',()=>drag=null);stage.addEventListener('pointercancel',()=>drag=null);
function save(){let o={};defs.forEach(d=>o[d.id]={x:parseFloat(els[d.id].style.left),y:parseFloat(els[d.id].style.top)});try{localStorage.setItem('blueHomeLayout',JSON.stringify(o));document.getElementById('status').textContent='摆放位置已保存在这个浏览器里。';}catch(e){document.getElementById('status').textContent='浏览器不允许保存；关闭页面前请记得截图留存。'}}
document.getElementById('saveBtn').onclick=save;document.getElementById('resetBtn').onclick=()=>{defs.forEach(d=>{els[d.id].style.left=d.x+'%';els[d.id].style.top=d.y+'%'});try{localStorage.removeItem('blueHomeLayout')}catch(e){}choose('girl');document.getElementById('status').textContent='已恢复初始布局。'};
document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{choose('girl');let p={up:[0,-2],down:[0,2],left:[-2,0],right:[2,0]}[b.dataset.move],el=els.girl;el.style.left=Math.max(0,Math.min(92,parseFloat(el.style.left)+p[0]))+'%';el.style.top=Math.max(0,Math.min(90,parseFloat(el.style.top)+p[1]))+'%';save()});choose('girl');
</script></body></html>
